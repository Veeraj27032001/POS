<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Vedix POS</title>
    <style>
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f8f9fa;
        color: #212529;
        font-family: "Source Sans 3", system-ui, -apple-system, sans-serif;
        padding: 24px;
      }
      .panel {
        max-width: 22rem;
        text-align: center;
      }
      h1 {
        font-size: 1.25rem;
        margin: 0 0 0.5rem;
      }
      p {
        margin: 0 0 1.25rem;
        font-size: 0.95rem;
        color: #6c757d;
        line-height: 1.5;
      }
      button {
        background: #0d6efd;
        color: #fff;
        border: 0;
        border-radius: 0.375rem;
        padding: 0.6rem 1.1rem;
        font: inherit;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="panel">
      <h1>Can't reach the POS server</h1>
      <p>
        The till needs a connection to load. Check this device's network, then try again.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
